<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=300,height=50" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1 user-scalable=no"
    />

    <script type="text/javascript">
      var clickTag = "";
    </script>

    <style type="text/css">
      html,
      body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #222;
      }
      body::before,
      body::after {
        display: block;
        content: "";
        flex: 2;
      }
      body::after {
        flex: 3;
      }
      img,
      span,
      div {
        border: none;
      }

      [class*="-scene"] {
        opacity: 0;
      }
      [data-scene="0"] .-scene0,
      [data-scene="1"] .-scene1 {
        opacity: 1;
      }

      #canvas {
        display: block;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
        flex: none;
        width: 300px;
        height: 50px;
        background: #000;
      }
      #canvas::after {
        content: "";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999999;
        pointer-events: none;
      }

      .frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      img.abs,
      .box {
        position: absolute;
        display: block;
      }

      .bg-photo {
        top: 0;
        left: 0;
        width: 300px;
        height: 50px;
        object-fit: cover;
        transform-origin: center center;
      }

      .ymca-logo {
        height: 48px;
        width: auto;
        bottom: 0;
        right: 0;
        will-change: transform, opacity;
      }

      .copy {
        position: absolute;
        top: 0px;
        width: 190px;
        left: 4px;
      }

      @keyframes textIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes bgZoom {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.16);
        }
      }

      [data-scene="0"] .bg-photo {
        animation: bgZoom 10000ms linear forwards;
      }

      [data-scene="0"] .copy {
        animation: textIn 400ms ease-out both;
        animation-delay: 1000ms;
      }

      .end-card {
        background: #fff;
      }

      .headline {
        position: absolute;
        width: 148px;
        left: 10px;
        top: 10px;
      }

      .shine-logo {
        top: 7px;
        right: 20px;
        height: 34px;
        width: auto;
      }

      [data-scene="1"] .shine-logo,
      [data-scene="1"] .headline {
        animation: textIn 500ms ease-out both;
        animation-delay: 200ms;
      }
    </style>
  </head>
  <body>
    <a
      id="canvas"
      href="javascript:window.open(window.clickTag)"
      data-frames="[1,1]"
      data-duration="10000"
      data-iterations="1"
    >
      <div class="frame -scene0">
        <img class="bg-photo abs -scene0" src="300x50-BG.webp" alt="" />
        <img class="ymca-logo abs -scene0" src="YMCA-LOGO.webp" alt="" />
        <img src="text-300x50.svg" class="copy -scene0" alt="" />
      </div>

      <div class="frame -scene1 end-card">
        <img src="charity-300x50.svg" class="headline -scene1" alt="" />
        <img
          class="shine-logo abs -scene1"
          src="shine-on-logo-300x50.webp"
          alt=""
        />
      </div>
    </a>

    <script>
      !(function () {

              .querySelector('meta[name="ad.size"]')
              .content.split(",");
            (s.style.width = parseInt(t[0].split("=")[1], 10) + "px"),
              (s.style.height = parseInt(t[1].split("=")[1], 10) + "px");
          }
          (b = o = parseInt(s.getAttribute("data-iterations"))),
            this.reScale(
              JSON.parse(s.getAttribute("data-frames")),
              parseInt(s.getAttribute("data-duration"))
            ),
            (i = m.length - 1),
            this.animate();
        }
        (u.prototype.reScale = function (t, e) {
          l = o > 0 ? e / o : e;
          var a = t.reduce(function (t, e) {
            return t + e;
          }, 0);
          m = t.map(function (t) {
            return (t / a) * l;
          });
        }),
          (u.prototype.goToFrame = function (e) {
            this.pause(), (b = 0), (i = e), s.setAttribute("data-scene", e);
          }),
          (u.prototype.next = function () {
            return ++i !== m.length || ((i = 0), b--)
              ? (s.setAttribute("data-scene", i), i)
              : ((b = o - 1), (i = -1));
          }),
          (u.prototype.animate = function () {
            -1 !== this.next() &&
              (y = window.setTimeout(this.animate.bind(this), m[i]));
          }),
          (u.prototype.pause = function () {
            y && clearTimeout(y);
          }),
          (c = function () {
            (window.banner = new u("canvas")),
              document.body.setAttribute("class", "loaded");
          }),
          "loading" !== document.readyState
            ? c()
            : document.addEventListener("DOMContentLoaded", c);
      })();
    </script>
  </body>
</html>
