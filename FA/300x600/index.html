<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=300,height=600" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1 user-scalable=no"
    />

    <script type="text/javascript">
      var clickTag = "";
    </script>

    <style type="text/css">
      /* -------------------------------------------------- */
      /* 1. BASE LAYOUT & RESET                             */
      /* -------------------------------------------------- */
      html,
      body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #222;
      }

      body::before,
      body::after {
        display: block;
        content: "";
        flex: 2;
      }

      body::after {
        flex: 3;
      }

      img,
      span,
      div {
        border: none;
      }

      #canvas {
        display: block;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
        flex: none;
        width: 100%;
        height: 100%;
        background: #fff;
      }

      #canvas::after {
        content: "";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999999;
        pointer-events: none;
      }

      .frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* -------------------------------------------------- */
      /* 2. SCENE VISIBILITY CONTROLLER                     */
      /* -------------------------------------------------- */
      [class*="-scene"] {
        opacity: 0;
      }

      [data-scene="0"] .-scene0,
      [data-scene="1"] .-scene1,
      [data-scene="2"] .-scene2 {
        opacity: 1;
      }

      /* -------------------------------------------------- */
      /* 3. ELEMENT BASE STYLES                             */
      /* -------------------------------------------------- */
      img.abs,
      .box,
      .cta {
        position: absolute;
        display: block;
      }

      .bg-photo {
        top: 0;
        left: 0;
        width: 300px;
        height: 600px;
        object-fit: cover;
        transform-origin: center center;
      }

      .ymca-logo {
        position: absolute;
        width: 150px;
        bottom: 0px;
        right: 0px;
      }

      .box {
        position: absolute;
        top: 188px;
        left: 0;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 0 8px 8px 0;
        transform: translateX(-100%);
        will-change: transform;
      }

      .tab-scene0 {
        width: 254px;
        height: 62px;
        z-index: 4;
      }

      .tab-scene1 {
        width: 242px;
        height: 62px;
        z-index: 5;
      }

      .copy {
        position: absolute;
      }

      .tab-scene0 img.copy,
      .tab-scene1 img.copy {
        width: 90%;
        top: 8px;
        left: 8px;
      }

      /* -------------------------------------------------- */
      /* 4. KEYFRAME DEFINITIONS                            */
      /* -------------------------------------------------- */
      @keyframes bgZoom {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.05);
        }
      }

      @keyframes tabSlideIn {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }

      @keyframes tabSlideOut {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-100%);
        }
      }

      @keyframes textIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes ctaSlideIn {
        from {
          transform: translateX(-220px);
        }
        to {
          transform: translateX(0);
        }
      }

      /* -------------------------------------------------- */
      /* 5. SCENE STAGING & TIMELINE CONTROLS               */
      /* -------------------------------------------------- */
      [data-scene="0"] .bg-photo,
      [data-scene="1"] .bg-photo {
        animation: bgZoom 16300ms linear forwards;
      }

      [data-scene="0"] .tab-scene0 {
        animation: tabSlideIn 450ms cubic-bezier(0.25, 1, 0.5, 1) forwards;
        animation-delay: 600ms;
      }

      [data-scene="1"] .tab-scene0 {
        animation: tabSlideOut 350ms cubic-bezier(0.5, 0, 0.75, 0) forwards;
      }
      [data-scene="1"] .tab-scene1 {
        animation: tabSlideIn 450ms cubic-bezier(0.25, 1, 0.5, 1) forwards;
        animation-delay: 100ms;
      }

      .end-card {
        background: #fff;
      }

      .headline {
        position: absolute;
        width: 245px;
        left: 24px;
        top: 82px;
      }

      .cta {
        top: 236px;
        left: 0;
        width: 200px;
      }

      .triangle {
        display: block;
        width: 100%;
      }

      .donate-text {
        position: absolute;
        width: 75%;
        left: 24px;
        top: 12px;
      }

      .shine-logo {
        position: absolute;
        top: 408px;
        left: 55%;
        width: 210px;
        transform: translateX(-50%);
      }

      .subhead {
        position: absolute;
        bottom: 70px;
        right: 43px;
        width: 169px;
      }

      /* End Card Animations */
      [data-scene="2"] .headline {
        animation: fadeUp 500ms ease-out both;
      }
      [data-scene="2"] .cta {
        animation: ctaSlideIn 450ms ease-out both;
        animation-delay: 200ms;
      }
      [data-scene="2"] .cta span {
        animation: textIn 300ms ease-out both;
        animation-delay: 600ms;
      }
      [data-scene="2"] .shine-logo {
        animation: textIn 500ms ease-out both;
        animation-delay: 450ms;
      }
      [data-scene="2"] .subhead {
        animation: textIn 500ms ease-out both;
        animation-delay: 600ms;
      }
    </style>
  </head>
  <body>
    <a
      id="canvas"
      href="javascript:window.open(window.clickTag)"
      data-frames="[0.7, 0.6, 1.2]"
      data-duration="18000"
      data-iterations="1"
    >
      <div class="frame -scene0 -scene1">
        <img
          class="bg-photo abs -scene0 -scene1"
          src="300x600-BG.webp"
          alt=""
        />
        <img
          class="ymca-logo abs -scene0 -scene1"
          src="YMCA-LOGO.webp"
          alt=""
        />

        <div class="box tab-scene0 -scene0 -scene1">
          <img src="text1-300x600.svg" class="copy" alt="" />
        </div>

        <div class="box tab-scene1 -scene1">
          <img src="text2-300x600.svg" class="copy" alt="" />
        </div>
      </div>

      <div class="frame -scene2 end-card">
        <img src="fa-300x600.svg" class="headline -scene2" alt="" />

        <div class="cta -scene2">
          <img src="Triangle.png" class="triangle" alt="" />
          <img src="donate-today.svg" class="donate-text" alt="" />
        </div>

        <img class="shine-logo abs -scene2" src="shine-on-logo.webp" alt="" />
        <img src="subhead.svg" class="subhead -scene2" alt="" />
      </div>
    </a>

    <script>
      !(function () {

              .content.split(",");
            (s.style.width = parseInt(t[0].split("=")[1], 10) + "px"),
              (s.style.height = parseInt(t[1].split("=")[1], 10) + "px");
          }
          (b = o = parseInt(s.getAttribute("data-iterations"))),
            this.reScale(
              JSON.parse(s.getAttribute("data-frames")),
              parseInt(s.getAttribute("data-duration"))
            ),
            (i = m.length - 1),
            this.animate();
        }
        (u.prototype.reScale = function (t, e) {
          l = o > 0 ? e / o : e;
          var a = t.reduce(function (t, e) {
            return t + e;
          }, 0);
          m = t.map(function (t) {
            return (t / a) * l;
          });
        }),
          (u.prototype.goToFrame = function (e) {
            this.pause(), (b = 0), (i = e), s.setAttribute("data-scene", e);
          }),
          (u.prototype.next = function () {
            return ++i !== m.length || ((i = 0), b--)
              ? (s.setAttribute("data-scene", i), i)
              : ((b = o - 1), (i = -1));
          }),
          (u.prototype.animate = function () {
            -1 !== this.next() &&
              (y = window.setTimeout(this.animate.bind(this), m[i]));
          }),
          (u.prototype.pause = function () {
            y && clearTimeout(y);
          }),
          (c = function () {
            (window.banner = new u("canvas")),
              document.body.setAttribute("class", "loaded");
          }),
          "loading" !== document.readyState
            ? c()
            : document.addEventListener("DOMContentLoaded", c);
      })();
    </script>
  </body>
</html>
