<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=970,height=250" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />

    <script type="text/javascript">
      var clickTag = "";
    </script>

    <style type="text/css">
      /* -------------------------------------------------- */
      /* 1. BASE LAYOUT & RESET                             */
      /* -------------------------------------------------- */
      html,
      body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #222;
      }

      body::before,
      body::after {
        display: block;
        content: "";
        flex: 2;
      }

      body::after {
        flex: 3;
      }

      img,
      span,
      div {
        border: none;
      }

      #canvas {
        display: block;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
        flex: none;
        width: 970px;
        height: 250px;
        background: #000;
      }

      #canvas::after {
        content: "";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999999;
        pointer-events: none;
      }

      .frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* -------------------------------------------------- */
      /* 2. SCENE VISIBILITY CONTROLLER                     */
      /* -------------------------------------------------- */
      [class*="-scene"] {
        opacity: 0;
      }

      [data-scene="0"] .-scene0,
      [data-scene="1"] .-scene1,
      [data-scene="2"] .-scene2 {
        opacity: 1;
      }

      /* -------------------------------------------------- */
      /* 3. ELEMENT BASE STYLES                             */
      /* -------------------------------------------------- */
      img.abs,
      .box,
      .shine-logo {
        position: absolute;
        display: block;
      }

      .bg-photo {
        top: 0;
        left: 0;
        width: 970px;
        height: 250px;
        object-fit: cover;
        transform-origin: center center;
      }

      .box {
        position: absolute;
        top: 48px;
        left: 0;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 0 8px 8px 0;
        transform: translateX(-100%);
        will-change: transform;
      }

      .tab-scene0 {
        width: 290px;
        height: 185px;
        z-index: 4;
      }

      .tab-scene1 {
        width: 340px;
        height: 120px;
        z-index: 5;
      }

      .copy {
        position: absolute;
        left: 18px;
        height: auto;
        margin: 0;
      }

      .tab-scene0 .copy {
        top: 30px;
        width: 250px;
      }

      .tab-scene1 .copy {
        top: 22px;
        width: 290px;
      }

      .corner-white-bg {
        position: absolute;
        bottom: 0;
        right: 0;
        height: 109px;
        width: auto;
        transform-origin: bottom right;
        z-index: 12;
        will-change: transform;
      }

      .ymca-logo {
        position: absolute;
        bottom: 0px;
        right: 0px;
        height: 123px;
        width: auto;
        z-index: 13;
      }

      .red-wipe {
        position: absolute;
        top: 0;
        left: 0;
        width: 970px;
        height: 250px;
        background-color: #e31837;
        clip-path: polygon(0 0, 58% 0, 44% 100%, 0 100%);
        transform: translateX(-100%);
        z-index: 10;
        will-change: transform;
      }

      /* End Card Styles */
      .end-card {
        background: #ffffff;
      }

      .headline {
        position: absolute;
        top: 38px;
        left: 55px;
        margin: 0;
        width: 360px;
      }

      .shine-logo {
        top: 70px;
        right: 74px;
        width: 254px;
        height: auto;
      }

      .subhead {
        position: absolute;
        bottom: 37px;
        right: 82px;
        width: 225px;
        margin: 0;
      }

      /* -------------------------------------------------- */
      /* 4. KEYFRAME DEFINITIONS                            */
      /* -------------------------------------------------- */
      @keyframes bgZoom {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.08);
        }
      }

      @keyframes tabSlideIn {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }

      @keyframes tabSlideOut {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-100%);
        }
      }

      @keyframes scaleCornerUp {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(12);
        }
      }

      @keyframes slideRedIn {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @keyframes textIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* -------------------------------------------------- */
      /* 5. SCENE STAGING & TIMELINE CONTROLS               */
      /* -------------------------------------------------- */
      /* Scene 0 */
      [data-scene="0"] .bg-photo {
        animation: bgZoom 15000ms linear forwards;
      }

      [data-scene="0"] .tab-scene0 {
        animation: tabSlideIn 500ms cubic-bezier(0.25, 1, 0.5, 1) forwards;
        animation-delay: 500ms;
      }

      /* Scene 1 */
      [data-scene="1"] .bg-photo {
        animation: bgZoom 15000ms linear forwards;
      }

      [data-scene="1"] .tab-scene0 {
        animation: tabSlideOut 400ms cubic-bezier(0.5, 0, 0.75, 0) forwards;
      }

      [data-scene="1"] .tab-scene1 {
        animation: tabSlideIn 500ms cubic-bezier(0.25, 1, 0.5, 1) forwards;
        animation-delay: 100ms;
      }

      [data-scene="1"] .corner-white-bg {
        animation: scaleCornerUp 1200ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
        animation-delay: 4500ms;
      }

      [data-scene="1"] .red-wipe {
        animation: slideRedIn 750ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
        animation-delay: 4300ms;
      }

      [data-scene="1"] .ymca-logo {
        animation: fadeOut 250ms ease-out forwards;
        animation-delay: 4500ms;
      }

      /* Scene 2 (End Card) */
      [data-scene="2"] .headline {
        animation: fadeUp 500ms ease-out both;
      }

      [data-scene="2"] .shine-logo {
        animation: textIn 500ms ease-out both;
        animation-delay: 100ms;
      }

      [data-scene="2"] .subhead {
        animation: textIn 350ms ease-out both;
        animation-delay: 200ms;
      }
    </style>
  </head>
  <body>
    <a
      id="canvas"
      href="javascript:window.open(window.clickTag)"
      data-frames="[1, 1, 2]"
      data-duration="20000"
      data-iterations="1"
    >
      <div class="frame -scene0 -scene1">
        <img
          class="bg-photo abs -scene0 -scene1"
          src="970x250-BG.webp"
          alt=""
        />

        <div class="box tab-scene0 -scene0 -scene1">
          <img src="text1-970x250.svg" class="copy" alt="" />
        </div>

        <div class="box tab-scene1 -scene1">
          <img src="text2-970x250.svg" class="copy" alt="" />
        </div>

        <img
          class="corner-white-bg -scene0 -scene1"
          src="corner-white.webp"
          alt=""
        />
        <img class="ymca-logo -scene0 -scene1" src="ymca-logo.webp" alt="" />

        <div class="red-wipe -scene1"></div>
      </div>

      <div class="frame -scene2 end-card">
        <img src="text3-970x250.svg" class="headline -scene2" alt="" />
        <img class="shine-logo abs -scene2" src="shine-on-logo.webp" alt="" />
        <img src="subhead.svg" class="subhead -scene2" alt="" />
      </div>
    </a>

    <script type="text/javascript">
      !(function () {
        var s, y, m, b, o, l, i, c;
        function u(e) {

              .querySelector('meta[name="ad.size"]')
              .content.split(",");
            (s.style.width = parseInt(t[0].split("=")[1], 10) + "px"),
              (s.style.height = parseInt(t[1].split("=")[1], 10) + "px");
          }
          (b = o = parseInt(s.getAttribute("data-iterations"))),
            this.reScale(
              JSON.parse(s.getAttribute("data-frames")),
              parseInt(s.getAttribute("data-duration"))
            ),
            (i = m.length - 1),
            this.animate();
        }
        (u.prototype.reScale = function (t, e) {
          l = o > 0 ? e / o : e;

        }),
          (u.prototype.goToFrame = function (e) {

            -1 !== this.next() &&
              (y = window.setTimeout(this.animate.bind(this), m[i]));

          (u.prototype.pause = function () {
            y && clearTimeout(y);

          (c = function () {
            (window.banner = new u("canvas")),

          }),
          "loading" !== document.readyState
            ? c()
            : document.addEventListener("DOMContentLoaded", c);
      })();
    </script>
  </body>
</html>
