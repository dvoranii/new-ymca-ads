<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=728,height=90" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />

    <script type="text/javascript">
      var clickTag = "";
    </script>

    <style type="text/css">
      html,
      body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #222;
      }
      body::before,
      body::after {
        display: block;
        content: "";
        flex: 2;
      }
      body::after {
        flex: 3;
      }
      img,
      span,
      div {
        border: none;
      }

      [class*="-scene"] {
        opacity: 0;
      }
      [data-scene="0"] .-scene0,
      [data-scene="1"] .-scene1,
      [data-scene="2"] .-scene2 {
        opacity: 1;
      }

      #canvas {
        display: block;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
        flex: none;
        width: 728px;
        height: 90px;
        background: #000;
      }
      #canvas::after {
        content: "";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999999;
        pointer-events: none;
      }

      .frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      img.abs,
      .box,
      .shine-logo {
        position: absolute;
        display: block;
      }

      .bg-photo {
        top: 0;
        left: 0;
        width: 728px;
        height: 90px;
        object-fit: cover;
        transform-origin: center center;
      }

      .corner-white-bg {
        position: absolute;
        bottom: -1px;
        right: -1px;
        height: 75px;
        width: auto;
        transform-origin: bottom right;
        z-index: 12;
        will-change: transform;
      }

      .ymca-logo {
        position: absolute;
        bottom: 0px;
        right: 0px;
        height: 80px;
        width: auto;
        z-index: 13;
      }

      .box {
        top: 12px;
        left: 0;
        width: 280px;
        height: 68px;
        background: rgba(255, 255, 255, 0.88);
        border-radius: 0 16px 16px 0;
        transition: width 500ms ease;
        z-index: 4;
      }

      .copy {
        position: absolute;
        top: 8px;
        left: 16px;
        height: 74px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 0;
        font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
        font-weight: 500;
        font-size: 24px;
        line-height: 1.15;
        color: #89171a;
        z-index: 5;
      }

      [data-scene="0"] .box {
        width: 295px;
      }
      [data-scene="1"] .box {
        width: 225px;
      }

      .red-wipe {
        position: absolute;
        top: 0;
        left: -300px;
        width: 1400px;
        height: 90px;
        background-color: #e31837;
        clip-path: polygon(0 0, 75% 0, 45% 100%, 0 100%);
        transform: translateX(-100%);
        z-index: 10;
        will-change: transform;
      }

      @keyframes boxIn {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes textIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes bgZoom {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.08);
        }
      }

      @keyframes scaleCornerUp {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(18);
        }
      }

      @keyframes slideRedIn {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(0%);
        }
      }

      [data-scene="0"] .bg-photo {
        animation: textIn 600ms ease-out both, bgZoom 15000ms linear forwards;
      }
      [data-scene="1"] .bg-photo {
        animation: bgZoom 15000ms linear forwards;
      }

      [data-scene="0"] .ymca-logo,
      [data-scene="0"] .corner-white-bg {
        animation: slideInRight 600ms cubic-bezier(0.25, 1, 0.5, 1) both;
        animation-delay: 200ms;
      }

      [data-scene="0"] .box {
        animation: boxIn 450ms ease-out both;
        animation-delay: 450ms;
      }
      [data-scene="0"] .copy.-scene0 {
        animation: textIn 300ms ease-out both;
        animation-delay: 700ms;
      }

      [data-scene="1"] .copy.-scene1 {
        animation: textIn 300ms ease-out both;
        animation-delay: 280ms;
      }

      [data-scene="1"] .corner-white-bg {
        animation: scaleCornerUp 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        animation-delay: 4500ms;
      }

      [data-scene="1"] .red-wipe {
        animation: slideRedIn 800ms cubic-bezier(0.25, 1, 0.5, 1) forwards;
        animation-delay: 4500ms;
      }

      [data-scene="1"] .ymca-logo {
        animation: fadeOut 400ms ease-out forwards;
        animation-delay: 4500ms;
      }

      .end-card {
        background: #ffffff;
      }

      .headline {
        position: absolute;
        top: 28px;
        left: 54px;
        margin: 0;
        font-family: "Century Gothic", CenturyGothic, AppleGothic, Futura,
          "Trebuchet MS", sans-serif;
        font-weight: 300;
        font-size: 30px;
        line-height: 1;
        letter-spacing: -0.3px;
        color: #89171a;
        -webkit-font-smoothing: antialiased;
      }

      .headline b {
        font-weight: 900;
        font-size: 27px;
      }

      .shine-logo {
        top: 8px;
        right: 48px;
        width: 144px;
      }

      .subhead {
        position: absolute;
        bottom: 8px;
        right: 54px;
        margin: 0;
        text-align: center;
        font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
        font-size: 11px;
        line-height: 1.1;
        color: #525252;
        display: flex;
        flex-direction: column;
      }

      [data-scene="2"] .headline {
        animation: fadeUp 250ms ease-out both;
      }
      [data-scene="2"] .shine-logo {
        animation: textIn 250ms ease-out both;
        animation-delay: 100ms;
      }
      [data-scene="2"] .subhead {
        animation: textIn 250ms ease-out both;
        animation-delay: 200ms;
      }
    </style>
  </head>
  <body>
    <a
      id="canvas"
      href="javascript:window.open(window.clickTag)"
      data-frames="[1, 1, 2]"
      data-duration="20000"
      data-iterations="1"
    >
      <!-- MAIN SCENES (0 & 1) -->
      <div class="frame -scene0 -scene1">
        <img class="bg-photo abs -scene0 -scene1" src="728x90-BG.png" alt="" />

        <div class="box abs -scene0 -scene1"></div>

        <p class="copy -scene0">
          <span>From your first splash to</span>
          <span>your new healthy habit.</span>
        </p>
        <p class="copy -scene1">
          <span
            >Experience bein<span style="font-family: Arial, sans-serif"
              >g</span
            ></span
          >
          <span
            >Greater To<span style="font-family: Arial, sans-serif">g</span
            >ether.</span
          >
        </p>

        <img
          class="corner-white-bg -scene0 -scene1"
          src="corner-small.png"
          alt=""
        />
        <img class="ymca-logo -scene0 -scene1" src="YMCA-LOGO.png" alt="" />

        <div class="red-wipe -scene1"></div>
      </div>

      <div class="frame -scene2 end-card">
        <h1 class="headline -scene2">Discover <b>AquaFit</b> at the YMCA!</h1>

        <img
          class="shine-logo abs -scene2"
          src="shine-on-logo-728x90.png"
          alt=""
        />

        <p class="subhead -scene2">
          <span
            >A charity that i<span style="font-family: Arial">g</span>nites
            the</span
          >
          <span>potential in people</span>
        </p>
      </div>
    </a>

    <script type="text/javascript">
      !(function () {

              .content.split(",");

              (s.style.height = parseInt(t[1].split("=")[1], 10) + "px");
          }
          (b = o = parseInt(s.getAttribute("data-iterations"))),
            this.reScale(
              JSON.parse(s.getAttribute("data-frames")),
              parseInt(s.getAttribute("data-duration"))
            ),
            (i = m.length - 1),
            this.animate();
        }
        (u.prototype.reScale = function (t, e) {

        }),
          (u.prototype.goToFrame = function (e) {

          (u.prototype.animate = function () {

              (y = window.setTimeout(this.animate.bind(this), m[i]));

          (u.prototype.pause = function () {

          }),
          (c = function () {
            (window.banner = new u("canvas")),
              document.body.setAttribute("class", "loaded");
          }),
          "loading" !== document.readyState
            ? c()
            : document.addEventListener("DOMContentLoaded", c);
      })();
    </script>
  </body>
</html>
