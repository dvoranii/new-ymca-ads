<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=300,height=250" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />

    <script type="text/javascript">
      var clickTag = "https://www.google.com";
    </script>

    <style type="text/css">
      /* -------------------------------------------------- */
      /* 1. BASE LAYOUT & RESET                             */
      /* -------------------------------------------------- */
      html,
      body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #222;
      }

      body::before,
      body::after {
        display: block;
        content: "";
        flex: 2;
      }

      body::after {
        flex: 3;
      }

      img,
      span,
      div {
        border: none;
      }

      #canvas {
        display: block;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
        flex: none;
        width: 300px;
        height: 250px;
        background: #000;
      }

      #canvas::after {
        content: "";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999999;
        pointer-events: none;
      }

      .frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* -------------------------------------------------- */
      /* 2. SCENE VISIBILITY CONTROLLER                     */
      /* -------------------------------------------------- */
      [class*="-scene"] {
        opacity: 0;
      }

      [data-scene="0"] .-scene0,
      [data-scene="1"] .-scene1,
      [data-scene="2"] .-scene2 {
        opacity: 1;
      }

      /* -------------------------------------------------- */
      /* 3. ELEMENT BASE STYLES                             */
      /* -------------------------------------------------- */
      img.abs,
      .box,
      .cta,
      .shine-logo {
        position: absolute;
        display: block;
        will-change: transform;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .bg-photo {
        top: 0;
        left: 0;
        width: 300px;
        height: 250px;
        object-fit: cover;
        transform-origin: center center;
      }

      .box {
        position: absolute;
        top: 105px;
        left: 0;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 0 6px 6px 0;
        transform: translateX(-100%);
      }

      .tab-scene0 {
        width: 245px;
        height: 60px;
        z-index: 4;
      }

      .tab-scene1 {
        width: 235px;
        height: 60px;
        z-index: 5;
      }

      .copy {
        position: absolute;
      }

      .tab-scene0 img.copy,
      .tab-scene1 img.copy {
        width: 90%;
        top: 8px;
        left: 10px;
      }

      .corner-white-bg {
        position: absolute;
        bottom: -1px;
        right: -1px;
        height: 50px;
        width: 92px;
        transform-origin: bottom right;
        z-index: 12;
        will-change: transform;
      }
      .ymca-logo {
        position: absolute;
        bottom: 0px;
        right: 0px;
        height: 56px;
        width: auto;
        z-index: 13;
      }

      .red-wipe {
        position: absolute;
        top: 0;
        left: -100px;
        width: 500px;
        height: 250px;
        background-color: #e31837;
        clip-path: polygon(0 0, 100% 0, 35% 100%, 0 100%);
        transform: translateX(-100%);
        z-index: 10;
        will-change: transform;
      }

      /* End Card Styles */
      .end-card {
        background: #fff;
      }

      .headline {
        position: absolute;
        width: 258px;
        left: 16px;
        top: 18px;
        z-index: 15;
      }

      .cta {
        top: 105px;
        left: 0;
        width: 270px;
        height: auto;
        transform: translateX(-270px);
        z-index: 16;
      }

      .cta-bg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .donate-text {
        position: absolute;
        top: 8px;
        width: 115px;
        left: 130px;
      }

      .shine-logo {
        position: absolute;
        top: 168px;
        left: 50%;
        width: 165px;
        transform: translateX(-50%);
        z-index: 15;
      }

      /* -------------------------------------------------- */
      /* 4. KEYFRAME DEFINITIONS                            */
      /* -------------------------------------------------- */
      @keyframes bgZoom {
        from {
          transform: scale(1) translate(0, 0);
        }
        to {
          transform: scale(1.2) translate(10px, 10px);
        }
      }

      @keyframes tabSlideIn {
        from {
          opacity: 0;
          transform: translateX(-150px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes tabSlideOut {
        from {
          opacity: 1;
          transform: translateX(0);
        }
        to {
          opacity: 0;
          transform: translateX(-150px);
        }
      }

      @keyframes scaleCornerUp {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(18);
        }
      }

      @keyframes slideRedIn {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(0%);
        }
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @keyframes textIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes ctaSlideIn {
        from {
          transform: translateX(-270px);
        }
        to {
          transform: translateX(0);
        }
      }

      /* -------------------------------------------------- */
      /* 5. SCENE STAGING & TIMELINE CONTROLS               */
      /* -------------------------------------------------- */
      /* Scene 0 */
      [data-scene="0"] .bg-photo,
      [data-scene="1"] .bg-photo {
        animation: bgZoom 15000ms linear forwards;
      }
      [data-scene="0"] .tab-scene0 {
        animation: tabSlideIn 640ms cubic-bezier(0.25, 0.46, 0.45, 0.94)
          forwards;
        animation-delay: 450ms;
      }

      /* Scene 1 */
      [data-scene="1"] .tab-scene0 {
        animation: tabSlideOut 400ms cubic-bezier(0.5, 0, 0.75, 0) forwards;
      }
      [data-scene="1"] .tab-scene1 {
        animation: tabSlideIn 640ms 320ms cubic-bezier(0.25, 0.46, 0.45, 0.94)
          forwards;
      }
      [data-scene="1"] .corner-white-bg {
        animation: scaleCornerUp 4000ms 4500ms cubic-bezier(0.25, 1, 0.5, 1)
          forwards;
      }
      [data-scene="1"] .red-wipe {
        animation: slideRedIn 800ms 4500ms cubic-bezier(0.25, 1, 0.5, 1)
          forwards;
      }
      [data-scene="1"] .ymca-logo {
        animation: fadeOut 400ms 4500ms ease-out forwards;
      }

      /* Scene 2 (End Card) */
      [data-scene="2"] .shine-logo {
        animation: textIn 250ms 100ms ease-out both;
      }

      [data-scene="2"] .headline {
        animation: fadeUp 640ms 320ms cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      }

      [data-scene="2"] .cta {
        animation: ctaSlideIn 540ms 1000ms cubic-bezier(0.22, 0.61, 0.36, 1)
          both;
      }
    </style>
  </head>
  <body>
    <a
      id="canvas"
      href="javascript:window.open(window.clickTag)"
      data-frames="[1, 1, 2]"
      data-duration="20000"
      data-iterations="1"
    >
      <div class="frame -scene0 -scene1">
        <img
          class="bg-photo abs -scene0 -scene1"
          src="300x250-BG.webp"
          alt=""
        />

        <div class="box tab-scene0 -scene0 -scene1">
          <img src="text1-300x250.svg" class="copy" alt="" />
        </div>

        <div class="box tab-scene1 -scene1">
          <img src="text2-300x250.svg" class="copy" alt="" />
        </div>

        <img
          class="corner-white-bg -scene0 -scene1"
          src="corner-small.webp"
          alt=""
        />
        <img class="ymca-logo -scene0 -scene1" src="YMCA-LOGO.webp" alt="" />

        <div class="red-wipe -scene1"></div>
      </div>

      <div class="frame -scene2 end-card">
        <img src="fa-300x250.svg" class="headline -scene2" alt="" />

        <div class="cta -scene2">
          <img src="Triangle.png" class="cta-bg" alt="" />
          <img src="donate-today.svg" class="donate-text" alt="" />
        </div>

        <img
          class="shine-logo abs -scene2"
          src="shine-on-logo-300x250.webp"
          alt=""
        />
      </div>
    </a>

    <script type="text/javascript">
      !(function () {

              .querySelector('meta[name="ad.size"]')
              .content.split(",");
            (s.style.width = parseInt(t[0].split("=")[1], 10) + "px"),
              (s.style.height = parseInt(t[1].split("=")[1], 10) + "px");
          }
          (b = o = parseInt(s.getAttribute("data-iterations"))),
            this.reScale(
              JSON.parse(s.getAttribute("data-frames")),
              parseInt(s.getAttribute("data-duration"))

            (i = m.length - 1),

        (u.prototype.reScale = function (t, e) {

          (c = function () {
            (window.banner = new u("canvas")),

          "loading" !== document.readyState
            ? c()
            : document.addEventListener("DOMContentLoaded", c);
      })();
    </script>
  </body>
</html>
